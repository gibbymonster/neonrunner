<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050f;--fg:#dff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 25%,#231250,var(--bg) 72%);color:var(--fg);font-family:'Press Start 2P',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;box-sizing:border-box}
#wrap{position:relative;width:100%;max-width:960px;border-radius:14px;overflow:hidden;border:3px solid #2b2058;box-shadow:0 0 0 2px #ff3b3b,0 0 40px #ff3b3b77,0 0 100px #39ff7a33}

canvas{display:block;width:100%;aspect-ratio:16/9;image-rendering:pixelated;touch-action:none;background:#000;user-select:none}
p{font-size:9px;line-height:1.9;text-align:center;margin:0;max-width:760px}
#fire{font-family:inherit;font-size:12px;color:#05050f;background:linear-gradient(180deg,#7dffa8,#1fd45f);border:3px solid #fff;border-radius:12px;padding:12px 28px;touch-action:none;user-select:none;box-shadow:0 0 18px #39ff7acc,0 4px 0 #0c7a33}
#fire:active{background:#fff}
.btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
#lockerBtn,#cheatBtn{font-family:inherit;font-size:11px;color:#fff;background:linear-gradient(180deg,#4a5878,#2a3350);border:3px solid #fff;border-radius:12px;padding:10px 22px;cursor:pointer;box-shadow:0 0 14px #3fa0ff99,0 4px 0 #151c33}
#cheatBtn{background:linear-gradient(180deg,#8a3a5a,#4a1a33);box-shadow:0 0 14px #ff3b6b99,0 4px 0 #2a0f1c}
#lockerBtn:active,#cheatBtn:active{background:#fff;color:#05050f}
[hidden]{display:none!important}
#locker{position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;gap:8px;padding:10px 12px;box-sizing:border-box;overflow-y:auto;background:repeating-linear-gradient(0deg,#16123a 0 2px,transparent 2px 28px),repeating-linear-gradient(90deg,#16123a 0 2px,transparent 2px 36px),#241e58;font-size:10px}
.lk-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.lk-head span{font-size:14px;color:#fff;text-shadow:0 0 8px #3fa0ff}
#lkDone{font-family:inherit;font-size:10px;color:#39ff7a;background:#150f33;border:2px solid #39ff7a;border-radius:8px;padding:8px 12px;cursor:pointer}
.lk-garland{height:6px;flex:none;background:repeating-linear-gradient(90deg,#ff3b3b 0 8px,#39ff7a 8px 16px,#ffd23f 16px 24px,#3fa0ff 24px 32px)}
#lkName{text-align:center;color:#ff3b3b;font-size:11px;min-height:14px;text-shadow:0 0 6px #ff3b3b}
#lkGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.lock{position:relative;font-family:inherit;color:#fff;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 4px 8px 12px;border:3px solid #0a0820;border-radius:4px;background:linear-gradient(90deg,#6a7898 0 8px,#4a5878 8px)}
.lock canvas{width:100%;max-width:80px;aspect-ratio:1;image-rendering:pixelated;background:#0c0a22;border:2px solid #0a0820}
.lock .num{position:absolute;top:3px;left:13px;z-index:1;font-size:7px;color:#8a8aa8}
.lock .nm{font-size:7px}
.lock .eq{display:none;font-size:6px;color:#39ff7a}
.lock:hover{border-color:#fff}
.lock.on{border-color:#39ff7a;box-shadow:0 0 14px #39ff7a99}
.lock.on .eq{display:block}
.lk-foot{text-align:center;font-size:7px;color:#8a8aa8;margin-top:auto}
#cheat{position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;background:rgba(5,5,15,.8);padding:8px;box-sizing:border-box}
.ch-box{width:100%;max-width:440px;background:#150f33;border:3px solid #ff3b6b;border-radius:10px;box-shadow:0 0 24px #ff3b6b88;padding:12px;box-sizing:border-box;display:flex;flex-direction:column;gap:8px;text-align:center}
.ch-t{font-size:12px;color:#ff3b6b;text-shadow:0 0 8px #ff3b6b}
#chIn{font-family:inherit;font-size:14px;text-transform:uppercase;text-align:center;letter-spacing:2px;color:#39ff7a;background:#05050f;border:2px solid #39ff7a;border-radius:6px;padding:8px;width:100%;box-sizing:border-box;outline:none}
#chMsg{font-size:8px;color:#ffd23f;min-height:10px}
.ch-help{font-size:6px;line-height:1.8;color:#8a8aa8}
.ch-row{display:flex;gap:8px;justify-content:center}
.ch-row button{font-family:inherit;font-size:9px;color:#39ff7a;background:#05050f;border:2px solid #39ff7a;border-radius:8px;padding:7px 12px;cursor:pointer}
#chX{color:#ff3b6b;border-color:#ff3b6b}
</style></head><body>
<div id="wrap"><canvas id="g" width="320" height="180"></canvas>
<div id="locker" hidden><div class="lk-head"><span>LOCKER ROOM</span><button id="lkDone" type="button">DONE</button></div><div class="lk-garland"></div><div id="lkName"></div><div id="lkGrid"></div><div class="lk-foot">CLICK A LOCKER TO EQUIP &middot; L / ESC = BACK</div></div>
<div id="cheat" hidden><div class="ch-box"><div class="ch-t">CHEAT CODE</div><input id="chIn" maxlength="12" autocomplete="off" autocapitalize="characters" spellcheck="false"><div id="chMsg"></div><div class="ch-row"><button id="chGo" type="button">GO</button><button id="chX" type="button">CANCEL</button></div></div></div></div>
<div class="btns"><button id="lockerBtn">LOCKER ROOM</button></div>
<button id="fire">FIRE TREES</button>
<script>
const c=document.getElementById('g');let x=c.getContext('2d');const mainX=x;x.imageSmoothingEnabled=false;
const W=320,H=180,G=140,PX=44,COINS_PER_HEART=25,MAXHP=5,ACC=['#ff3b3b','#39ff7a','#ffd23f','#ffffff','#3fa0ff'],CC=['#ff3b3b','#1f9d4a','#ffb02e','#e8f4ff','#3fa0ff'],SNOW='#e8f4ff',RED='#d8202a';
/* ---- character skins ---- */
const SK=[
 {id:'default',n:'DEFAULT',sw:'#3fa0ff',body:'#3fa0ff',legs:'#2b3a7a',boot:'#111',hair:'#2b1b3d'},
 {id:'xmas',n:'CHRISTMAS',sw:RED,body:RED,legs:RED,boot:'#111',hair:'#2b1b3d',top:'#fff',belt:1,beard:1,hat:'santa',scarf:'#39ff7a',glow:'#ff3b3b'},
 {id:'ninja',n:'NINJA',sw:'#1a1a24',body:'#1a1a24',legs:'#1a1a24',boot:'#000',hair:'#000',mask:'#1a1a24',mh:5,band:'#ff3b3b',scarf:'#ff3b3b'},
 {id:'hero',n:'HERO',sw:'#2a5bd7',body:'#2a5bd7',legs:'#2a5bd7',boot:'#d8202a',hair:'#2b1b3d',mask:'#d8202a',mh:3,emb:'#ffd23f',cape:'#d8202a'},
 {id:'wizard',n:'WIZARD',sw:'#6b3fc4',body:'#6b3fc4',legs:'#4a2a90',boot:'#2b1b3d',hair:'#ccc',hem:'#ffd23f',beard:1,hat:'wiz',glow:'#9b6bff'},
 {id:'robot',n:'ROBOT',sw:'#9aa3b5',body:'#9aa3b5',legs:'#6b7488',boot:'#333',face:'#cfd6e4',robot:1,emb:'#4aa8ff',glow:'#4aa8ff'},
 {id:'elf',n:'ELF',sw:'#1f9d4a',body:'#1f9d4a',legs:'#d8202a',boot:'#ffd23f',hair:'#8a5a2b',top:'#d8202a',belt:1,hat:'elf'},
 {id:'snowman',n:'SNOWMAN',sw:'#ffffff',body:'#ffffff',legs:'#e8f4ff',boot:'#333',face:'#ffffff',hair:'#ffffff',emb:'#111',hat:'top',scarf:'#d8202a',nose:'#ff9f1c'},
 {id:'reindeer',n:'REINDEER',sw:'#8a5a2b',body:'#8a5a2b',legs:'#6b4423',boot:'#222',face:'#c68642',hair:'#6b4423',top:'#e8d9a0',hat:'antlers',nose:'#ff2020',scarf:'#d8202a'},
 {id:'astro',n:'ASTRONAUT',sw:'#e8f4ff',body:'#e8f4ff',legs:'#cfd6e4',boot:'#888',hair:'#2b1b3d',top:'#ff9f1c',emb:'#ff9f1c',hat:'helmet'},
 {id:'cyber',n:'CYBER',sw:'#3ff',body:'#101830',legs:'#101830',boot:'#3ff',hair:'#000',mask:'#ff3bd4',mh:3,top:'#3ff',hem:'#ff3bd4',emb:'#3ff',glow:'#3ff'},
 {id:'ginger',n:'GINGERBREAD',sw:'#a0693a',body:'#a0693a',legs:'#8a5a2b',boot:'#6b4423',face:'#a0693a',hair:'#8a5a2b',top:'#fff',hem:'#fff',emb:'#ff3b3b'}
];
let skin=1;
try{const s=localStorage.getItem('nd_skin'),i=SK.findIndex(k=>k.id===s);if(i>=0)skin=i}catch(e){}
function setSkin(i){
 skin=((i%SK.length)+SK.length)%SK.length;
 try{localStorage.setItem('nd_skin',SK[skin].id)}catch(e){}
 if(typeof syncLockers==='function')syncLockers();
}
let lockPrev='ready';
const lkEl=document.getElementById('locker'),lkGrid=document.getElementById('lkGrid'),lkName=document.getElementById('lkName');
const prevs=SK.map((s,i)=>{
 const b=document.createElement('button');b.type='button';b.className='lock';
 b.innerHTML='<span class="num">'+(i+1)+'</span><canvas width="40" height="40"></canvas><span class="nm">'+s.n+'</span><span class="eq">EQUIPPED</span>';
 b.addEventListener('click',()=>{setSkin(i);b.blur()});
 b.addEventListener('mouseenter',()=>{lkName.textContent=s.n});
 b.addEventListener('mouseleave',()=>{lkName.textContent=SK[skin].n});
 lkGrid.appendChild(b);
 return{b,cx:b.querySelector('canvas').getContext('2d')};
});
function syncLockers(){prevs.forEach((p,j)=>p.b.classList.toggle('on',j===skin));lkName.textContent=SK[skin].n}
function openLocker(){if(st==='locker'||st==='cheat')return;lockPrev=st==='play'?'paused':st;st='locker';keys.down=false;keys.fire=false;touchDuck=false;touchFire=false;lkEl.hidden=false;syncLockers()}
function closeLocker(){if(st==='locker'){st=lockPrev;lkEl.hidden=true}}
document.getElementById('lockerBtn').addEventListener('click',e=>{openLocker();e.currentTarget.blur()});
document.getElementById('lkDone').addEventListener('click',closeLocker);
syncLockers();
let st='ready',speed,dist,pts,streak,level,lvStart,boss,banner,pops,hp,py,vy,duck,touchDuck=false,touchFire=false,shield,magnet,inv,obs,cn,pw,pb,cd,spawnIn,coinIn,coins,santa,santaIn,frame=0,scroll=0,hi=0,muted=false,shake=0,overT=0;
const keys={down:false,fire:false};
let tank=0,god=false,speedBoost=1,cheatPrev='play';
let parts=[];
const emit=(X,Y,n,col,sp=1.5,life=30)=>{for(let i=0;i<n;i++){const a=Math.random()*6.28,s=Math.random()*sp;parts.push({x:X,y:Y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-.5,t:life*(.5+Math.random()*.5),m:life,c:col})}};
try{hi=+localStorage.getItem('nd_hi')||0}catch(e){}
const R=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),w,h)};
const acc=()=>ACC[0],mu=()=>1+Math.min(4,(streak/5)|0),lvLen=()=>450+level*80,score=()=>Math.floor(pts);
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const hs=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)};
let ac;
function getAc(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function beep(f,d,t='square',v=.04){if(muted)return;try{const a=getAc(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
/* ---- background music: jingle-bell step sequencer ---- */
const ROOTS=[130.81,174.61,130.81,196],MEL=[5,5,5,5,5,4,4,4,4,2,2,4,2,-1,7,-1,4,4,4,-1,4,4,4,-1,4,7,0,2,4,-1,-1,-1];
let mAt=0,mStep=0;
function note(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.17)}
function musicTick(){
 if(muted||st!=='play'){mAt=0;return}
 if(!getAc())return;
 const sd=60/(128+Math.min(7,level)*6)/2,boss_=!!boss;
 if(mAt<ac.currentTime)mAt=ac.currentTime+.05;
 while(mAt<ac.currentTime+.25){
  const s=mStep%8,root=ROOTS[((mStep/8)|0)%4],m=MEL[mStep%32];
  note(root*(s%2?2:1)/2,mAt,sd*.9,boss_?'sawtooth':'triangle',.08);
  if(m>=0)note(523.25*Math.pow(2,m/12),mAt,sd*.8,'square',.03);
  if(s%4===0)kick(mAt);
  if(s%2===1)note(7000,mAt,.03,'square',.006);
  mAt+=sd;mStep++;
 }
}
function reset(){speed=2.6;dist=0;pts=0;streak=0;level=1;lvStart=0;boss=null;banner={s:'LEVEL 1',t:120};pops=[];hp=3;coins=0;py=G;vy=0;duck=false;shield=false;magnet=0;inv=0;tank=0;speedBoost=1;obs=[];cn=[];pw=[];pb=[];cd=0;spawnIn=120;coinIn=70;mStep=0;mAt=0;santa=null;santaIn=300+Math.random()*300;parts=[]}
reset();
const pop=(s,col)=>pops.push({s,x:PX,y:py-34,t:50,c:col});
function start(){reset();st='play'}
function jump(){
 if(st==='ready'){start();return}
 if(st==='over'){if(overT<=0)start();return}
 if(st==='play'&&py>=G){vy=-8.4;beep(520,.1);emit(PX+6,G,6,'#cfe4ff',1,20)}
}
function die(){st='over';overT=40;shake=10;beep(110,.4,'sawtooth');const s=score();if(s>hi){hi=s;try{localStorage.setItem('nd_hi',hi)}catch(e){}}}
function hurt(){
 if(inv>0||god||tank>0)return;
 if(shield){shield=false;inv=60;shake=5;beep(150,.2,'sawtooth');return}
 hp--;streak=0;inv=90;shake=7;emit(PX+6,py-9,18,'#ff3b6b',3,30);beep(150,.25,'sawtooth');
 if(hp<=0)die();
}
/* ---- cheat codes ---- */
const chEl=document.getElementById('cheat'),chIn=document.getElementById('chIn'),chMsg=document.getElementById('chMsg');
function openCheat(){
 if(st!=='play'&&st!=='paused')return;
 cheatPrev=st;st='cheat';keys.down=false;keys.fire=false;touchDuck=false;touchFire=false;
 chEl.hidden=false;chIn.value='';chMsg.textContent='TYPE A CODE + ENTER';chIn.focus();
}
function closeCheat(){if(st!=='cheat')return;chEl.hidden=true;chIn.blur();st=cheatPrev}
function nextLevel(){level++;lvStart=dist;boss=null;obs=[];banner={s:'LEVEL '+level,t:120};spawnIn=120;coinIn=70}
const CHEATS={
 SPEED(){speedBoost=10;pop('SPEED x10!','#ff3b6b');return'SPEED x10 ON'},
 TANK(){if(tank>0){tank=0;inv=60;return'TANK OFF'}tank=Infinity;inv=0;pop('TANK MODE!','#7dff4a');return'TANK ON'},
 HEALTH(){hp=MAXHP;pop('FULL HEALTH!','#ff3b6b');return'HEARTS REFILLED'},
 SHIELD(){shield=true;return'SHIELD ON'},
 MAGNET(){magnet=1800;return'MAGNET 30 SEC'},
 GOD(){god=!god;return god?'GOD MODE ON':'GOD MODE OFF'},
 RICH(){coins+=25;pts+=250;if(hp<MAXHP)hp++;pop('+25 BAUBLES!','#ffd23f');return'+25 BAUBLES'},
 BOSS(){if(boss)return'BOSS ALREADY HERE';obs=[];dist=lvStart+lvLen();return'SUMMONING SANTA-BOT'},
 SKIP(){nextLevel();return'SKIPPED TO LEVEL '+level}
};
function applyCheat(){
 const code=chIn.value.trim().toUpperCase(),fn=CHEATS[code];
 if(!fn){chMsg.textContent=code?'UNKNOWN CODE':'TYPE A CODE + ENTER';chMsg.style.color='#ff3b6b';chIn.select();beep(150,.15,'sawtooth');return}
 const m=fn();chMsg.style.color='#ffd23f';beep(880,.1,'triangle',.05);setTimeout(()=>beep(1320,.15,'triangle',.05),90);
 banner={s:m,t:90,c:'#7dff4a'};closeCheat();
}
chIn.addEventListener('keydown',e=>{
 if(e.key==='Enter'){e.preventDefault();applyCheat()}
 else if(e.key==='Escape'){e.preventDefault();closeCheat()}
 e.stopPropagation();
});
chIn.addEventListener('input',()=>{chMsg.style.color='#ffd23f'});
document.getElementById('chGo').addEventListener('click',applyCheat);
document.getElementById('chX').addEventListener('click',closeCheat);
const car=(k,X,col)=>{const i=Math.random()*3|0,th=Math.random()<.5?0:[5,7,9][i],h=k?14:9;return{t:'c',k,col,th,tl:[12,16,22][i],x:X,y:G-h-th,w:k?24:18,h:h+th}};
function spawn(){
 if(dist>60&&Math.random()<.04){obs.push({t:'s',x:W+10,y:G-88,w:44,h:78});banner={s:'DUCK! FAT SANTA!',t:90,c:'#ffec3d'};beep(260,.3,'sawtooth');return}
 const r=Math.random(),X=W+10,col=CC[Math.random()*5|0];
 if(dist>40&&r<.28)obs.push({t:'b',x:X,y:G-20,w:14,h:8,ru:Math.random()<.2});
 else if(r<.55)obs.push(car(0,X,col));
 else if(r<.8)obs.push(car(1,X,col));
 else obs.push(car(0,X,col),car(0,X+30,CC[Math.random()*5|0]));
}
function update(d){
 const base=Math.min(6.2,2.6+.4*(level-1)),prog=boss?0:Math.min(1,(dist-lvStart)/lvLen());
 speed+=(base+prog*.6-speed)*.03*d;
 const runSpeed=speed*speedBoost;
 dist+=runSpeed*d*.1;pts+=runSpeed*d*.1*mu();scroll+=runSpeed*d;
 const hold=keys.down||touchDuck;
 duck=hold&&py>=G;
 if(py<G&&hold)vy+=.5*d;
 vy+=.5*d;py+=vy*d;if(py>=G){py=G;vy=0}
 const ph=duck?9:18,pw_=duck?16:12,pr={x:PX+2,y:py-ph+2,w:pw_-4,h:ph-3},cx=PX+6,cy=py-ph/2;
 const tr={x:PX-6,y:py-18,w:36,h:18};
 if(banner)banner.t-=d;
 inv-=d;if(magnet>0)magnet-=d;cd-=d;
 if(tank>0){tank-=d;if(tank<=0){tank=0;inv=60;pop('TANK OFF','#8a8aa8')}}
 if(santa){santa.x-=1.4*d;if(santa.x<-60)santa=null}
 else{santaIn-=d;if(santaIn<=0){santa={x:W+10};santaIn=900+Math.random()*900;beep(1500,.12,'triangle',.03)}}
 if((keys.fire||touchFire||tank>0)&&cd<=0){pb.push(tank>0?{x:PX+30,y:py-13}:{x:PX+14,y:py-(duck?5:11)});cd=tank>0?9:12;beep(tank>0?300:990,.05,'square',.03)}
 if(!boss){
  if(dist-lvStart<lvLen()){
   spawnIn-=runSpeed*d;if(spawnIn<=0){spawn();spawnIn=110+speed*24+Math.random()*90}
   coinIn-=runSpeed*d;
   if(coinIn<=0){
    const y=G-(Math.random()<.5?34:54),n=3+(Math.random()*3|0);
    for(let i=0;i<n;i++)cn.push({x:W+10+i*14,y:y-Math.sin(i/(n-1)*Math.PI)*12});
    if(Math.random()<.17)pw.push({t:['s','m','h'][Math.random()*3|0],x:W+10+n*14+10,y:G-34});
    coinIn=150+Math.random()*200;
   }
  }else if(!obs.length){
   boss={hp:8+level*3,max:8+level*3,x:W+50,t:60,ps:[],flash:0};
   banner={s:'HO HO NO!',t:110,c:'#ff3b3b'};beep(200,.5,'sawtooth');
  }
 }
 for(const o of obs){
  o.x-=(runSpeed+(o.t==='b'?.7:o.t==='s'?1.2:0)*speedBoost)*d;
  if(tank>0&&!o.paid&&ov(tr,o)){o.paid=1;o.x=-999;streak+=2;pts+=30*mu();shake=3;emit(o.x<0?PX+30:o.x,G-10,14,'#ff9f1c',3,26);beep(120,.15,'sawtooth');continue}
  if(ov(pr,o)){o.paid=1;hurt()}
  else{
   const gap=o.t==='b'?pr.y-(o.y+o.h):o.y-(pr.y+pr.h);
   if(gap>=0&&gap<5&&pr.x<o.x+o.w+4&&pr.x+pr.w>o.x-4)o.near=1;
  }
  if(o.ru&&!o.paid&&o.x+o.w<PX){o.paid=1;streak+=3;pts+=50*mu();pop('RUDOLPH! +'+50*mu(),'#ff3b3b');beep(1100,.15,'triangle')}
