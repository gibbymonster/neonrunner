<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Neon Xmas Runner</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{--bg:#05050f;--fg:#dff;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:'Press Start 2P',monospace;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:12px;box-sizing:border-box}
canvas{width:100%;max-width:960px;aspect-ratio:16/9;image-rendering:pixelated;border:4px solid #ff3b3b;box-shadow:0 0 18px #39ff7a88;touch-action:none;background:#000;user-select:none}
p{font-size:9px;line-height:1.9;text-align:center;margin:0;max-width:760px}
#fire{font-family:inherit;font-size:12px;color:#05050f;background:#39ff7a;border:3px solid #fff;padding:12px 28px;touch-action:none;user-select:none;box-shadow:0 0 14px #ff3b3baa}
#fire:active{background:#fff}
</style></head><body>
<canvas id="g" width="320" height="180"></canvas>
<button id="fire">FIRE TREES</button>
<p>UP ARROW / TAP = JUMP &middot; DOWN ARROW / HOLD LOWER SCREEN = DUCK &middot; F / RIGHT ARROW / FIRE BUTTON = SHOOT SANTA-BOT &middot; P = PAUSE &middot; M = MUTE &middot; 25 BAUBLES = EXTRA HEART</p>
<script>
const c=document.getElementById('g'),x=c.getContext('2d');x.imageSmoothingEnabled=false;
const W=320,H=180,G=140,PX=44,COINS_PER_HEART=25,MAXHP=5,ACC=['#ff3b3b','#39ff7a','#ffd23f','#ffffff','#3fa0ff'],CC=['#ff3b3b','#1f9d4a','#ffb02e','#e8f4ff','#3fa0ff'],SNOW='#e8f4ff',RED='#d8202a';
let st='ready',speed,dist,pts,streak,level,lvStart,boss,banner,pops,hp,py,vy,duck,touchDuck=false,touchFire=false,shield,magnet,inv,obs,cn,pw,pb,cd,spawnIn,coinIn,coins,frame=0,scroll=0,hi=0,muted=false,shake=0,overT=0;
const keys={down:false,fire:false};
try{hi=+localStorage.getItem('nd_hi')||0}catch(e){}
const R=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(Math.round(a),Math.round(b),w,h)};
const acc=()=>ACC[(level-1)%5],mu=()=>1+Math.min(4,(streak/5)|0),lvLen=()=>450+level*80,score=()=>Math.floor(pts);
const ov=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const hs=(a,b)=>{const n=Math.sin(a*127.1+b*311.7)*43758.5453;return n-Math.floor(n)};
let ac;
function getAc(){try{ac=ac||new(window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume()}catch(e){}return ac}
function beep(f,d,t='square',v=.04){if(muted)return;try{const a=getAc(),o=a.createOscillator(),g=a.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(a.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,a.currentTime+d);o.stop(a.currentTime+d)}catch(e){}}
/* ---- background music: jingle-bell step sequencer ---- */
const ROOTS=[130.81,174.61,130.81,196],MEL=[5,5,5,5,5,4,4,4,4,2,2,4,2,-1,7,-1,4,4,4,-1,4,4,4,-1,4,7,0,2,4,-1,-1,-1];
let mAt=0,mStep=0;
function note(f,t,d,type,v){const o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+d+.02)}
function kick(t){const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.setValueAtTime(140,t);o.frequency.exponentialRampToValueAtTime(40,t+.12);g.gain.setValueAtTime(.12,t);g.gain.exponentialRampToValueAtTime(.001,t+.15);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+.17)}
function musicTick(){
 if(muted||st!=='play'){mAt=0;return}
 if(!getAc())return;
 const sd=60/(128+Math.min(7,level)*6)/2,boss_=!!boss;
 if(mAt<ac.currentTime)mAt=ac.currentTime+.05;
 while(mAt<ac.currentTime+.25){
  const s=mStep%8,root=ROOTS[((mStep/8)|0)%4],m=MEL[mStep%32];
  note(root*(s%2?2:1)/2,mAt,sd*.9,boss_?'sawtooth':'triangle',.08);
  if(m>=0)note(523.25*Math.pow(2,m/12),mAt,sd*.8,'square',.03);
  if(s%4===0)kick(mAt);
  if(s%2===1)note(7000,mAt,.03,'square',.006);
  mAt+=sd;mStep++;
 }
}
function reset(){speed=2.6;dist=0;pts=0;streak=0;level=1;lvStart=0;boss=null;banner={s:'LEVEL 1',t:120};pops=[];hp=3;coins=0;py=G;vy=0;duck=false;shield=false;magnet=0;inv=0;obs=[];cn=[];pw=[];pb=[];cd=0;spawnIn=120;coinIn=70;mStep=0;mAt=0}
reset();
const pop=(s,col)=>pops.push({s,x:PX,y:py-34,t:50,c:col});
function start(){reset();st='play'}
function jump(){
 if(st==='ready'){start();return}
 if(st==='over'){if(overT<=0)start();return}
 if(st==='play'&&py>=G){vy=-8.4;beep(520,.1)}
}
function die(){st='over';overT=40;shake=10;beep(110,.4,'sawtooth');const s=score();if(s>hi){hi=s;try{localStorage.setItem('nd_hi',hi)}catch(e){}}}
function hurt(){
 if(inv>0)return;
 if(shield){shield=false;inv=60;shake=5;beep(150,.2,'sawtooth');return}
 hp--;streak=0;inv=90;shake=7;beep(150,.25,'sawtooth');
 if(hp<=0)die();
}
const car=(k,X,col)=>{const i=Math.random()*3|0,th=Math.random()<.5?0:[5,7,9][i],h=k?14:9;return{t:'c',k,col,th,tl:[12,16,22][i],x:X,y:G-h-th,w:k?24:18,h:h+th}};
function spawn(){
 const r=Math.random(),X=W+10,col=CC[Math.random()*5|0];
 if(dist>40&&r<.28)obs.push({t:'b',x:X,y:G-20,w:14,h:8,ru:Math.random()<.2});
 else if(r<.55)obs.push(car(0,X,col));
 else if(r<.8)obs.push(car(1,X,col));
 else obs.push(car(0,X,col),car(0,X+30,CC[Math.random()*5|0]));
}
function update(d){
 const base=Math.min(6.2,2.6+.4*(level-1)),prog=boss?0:Math.min(1,(dist-lvStart)/lvLen());
 speed+=(base+prog*.6-speed)*.03*d;
 dist+=speed*d*.1;pts+=speed*d*.1*mu();scroll+=speed*d;
 const hold=keys.down||touchDuck;
 duck=hold&&py>=G;
 if(py<G&&hold)vy+=.5*d;
 vy+=.5*d;py+=vy*d;if(py>=G){py=G;vy=0}
 const ph=duck?9:18,pw_=duck?16:12,pr={x:PX+2,y:py-ph+2,w:pw_-4,h:ph-3},cx=PX+6,cy=py-ph/2;
 if(banner)banner.t-=d;
 inv-=d;if(magnet>0)magnet-=d;cd-=d;
 if((keys.fire||touchFire)&&cd<=0){pb.push({x:PX+14,y:py-(duck?5:11)});cd=12;beep(990,.05,'square',.03)}
 if(!boss){
  if(dist-lvStart<lvLen()){
   spawnIn-=speed*d;if(spawnIn<=0){spawn();spawnIn=110+speed*24+Math.random()*90}
   coinIn-=speed*d;
   if(coinIn<=0){
    const y=G-(Math.random()<.5?34:54),n=3+(Math.random()*3|0);
    for(let i=0;i<n;i++)cn.push({x:W+10+i*14,y:y-Math.sin(i/(n-1)*Math.PI)*12});
    if(Math.random()<.17)pw.push({t:['s','m','h'][Math.random()*3|0],x:W+10+n*14+10,y:G-34});
    coinIn=150+Math.random()*200;
   }
  }else if(!obs.length){
   boss={hp:8+level*3,max:8+level*3,x:W+50,t:60,ps:[],flash:0};
   banner={s:'HO HO NO!',t:110,c:'#ff3b3b'};beep(200,.5,'sawtooth');
  }
 }
 for(const o of obs){
  o.x-=(speed+(o.t==='b'?.7:0))*d;
  if(ov(pr,o)){o.paid=1;hurt()}
  else{
   const gap=o.t==='b'?pr.y-(o.y+o.h):o.y-(pr.y+pr.h);
   if(gap>=0&&gap<5&&pr.x<o.x+o.w+4&&pr.x+pr.w>o.x-4)o.near=1;
  }
  if(o.ru&&!o.paid&&o.x+o.w<PX){o.paid=1;streak+=3;pts+=50*mu();pop('RUDOLPH! +'+50*mu(),'#ff3b3b');beep(1100,.15,'triangle')}
  if(o.near&&!o.paid&&o.x+o.w<PX){o.paid=1;streak+=2;pts+=25*mu();pop('CLOSE! +'+25*mu(),'#ffec3d');beep(740,.08,'triangle')}
 }
 obs=obs.filter(o=>o.x>-40);
 for(const k of cn){
  k.x-=speed*d;
  if(magnet>0){const dx=cx-k.x,dy=cy-k.y,m=Math.hypot(dx,dy);if(m<80&&m>1){k.x+=dx/m*3*d;k.y+=dy/m*3*d}}
  if(Math.hypot(k.x-cx,k.y-cy)<10){
   k.d=1;streak++;pts+=10*mu();beep(880,.08);coins++;
   if(coins%COINS_PER_HEART===0){
    if(hp<MAXHP){hp++;pop('EXTRA HEART!','#ff3b6b')}else{pts+=100;pop('+100','#ffd23f')}
    beep(1040,.12,'triangle',.05);setTimeout(()=>beep(1320,.18,'triangle',.05),110);
   }
  }
 }
 cn=cn.filter(k=>!k.d&&k.x>-20);
 for(const p of pw){
  p.x-=speed*d;
  if(Math.hypot(p.x-cx,p.y-cy)<12){p.d=1;if(p.t==='s')shield=true;else if(p.t==='m')magnet=480;else if(hp<3)hp++;else pts+=50;beep(660,.18,'triangle')}
 }
 pw=pw.filter(p=>!p.d&&p.x>-20);
 for(const q of pb){
  q.x+=7*d;
  if(boss&&!boss.dead&&boss.x<W-4&&q.x+8>boss.x+2&&q.y+3>G-46&&q.y<G){q.d=1;boss.hp--;boss.flash=5;streak++;pts+=20*mu();shake=2;beep(300,.08,'sawtooth')}
 }
 pb=pb.filter(q=>!q.d&&q.x<W+10);
 if(boss){
  const b=boss;
  b.x+=((b.dead?W+60:250)-b.x)*.05*d;if(b.flash>0)b.flash-=d;
  if(!b.dead){
   b.t-=d;
   if(b.t<=0&&b.x<262){
    const up=Math.random()<.5,v=3+level*.35,mk=(u,dx)=>({x:b.x-6+dx,y:u?G-20:G-9,w:u?10:9,h:u?8:9,v});
    b.ps.push(mk(up,0));
    if(level>2&&Math.random()<.35)b.ps.push(mk(!up,40));
    b.t=Math.max(50,100-level*7)+Math.random()*30;
   }
   for(const p of b.ps){
    p.x-=p.v*d;
    if(ov(pr,p)){p.d=1;hurt()}
    else if(p.x+p.w<PX-4)p.d=1;
   }
   b.ps=b.ps.filter(p=>!p.d);
   if(b.hp<=0){
    b.dead=1;b.ps=[];b.dt=100;shake=14;pts+=500*mu();beep(80,.6,'sawtooth');banner={s:'SANTA-BOT DOWN!',t:100};
    for(let i=0;i<8;i++)cn.push({x:W+10+i*14,y:G-40-Math.sin(i/7*Math.PI)*14});
   }
  }else{
   b.dt-=d;
   if(b.dt<=0){level++;lvStart=dist;boss=null;banner={s:'LEVEL '+level,t:120};spawnIn=120;coinIn=70;if(hp<3)pw.push({t:'h',x:W+10,y:G-34})}
  }
 }
 for(const p of pops){p.y-=.4*d;p.t-=d}
 pops=pops.filter(p=>p.t>0);
 if(shake>0)shake-=.7*d;
}
function T(s,px,py_,sz,col,al='left'){x.font=sz+"px 'Press Start 2P',monospace";x.textAlign=al;x.fillStyle='rgba(0,0,0,.7)';x.fillText(s,px+1,py_+1);x.fillStyle=col;x.fillText(s,px,py_)}
/* santa hat sitting on a head whose top is hy */
function hat(hx,hy,w){R(hx,hy-1,w,2,'#fff');R(hx+1,hy-3,w-2,2,'#e11d2e');R(hx+w-2,hy-4,3,2,'#e11d2e');R(hx+w,hy-5,2,2,'#fff')}
/* pixel christmas tree; L = lights + star */
function tree(tx,ty,w,h,L){
 for(let r=0;r<h;r++){
  const rw=Math.max(1,Math.round(w*(r+1)/h)),rx=tx+(w-rw)/2;
  R(rx,ty+r,rw,1,r%3===2?'#1f9d4a':'#0f7a38');
  if(L&&rw>2&&hs(r,w*3+h)>.55)R(rx+((hs(r,h)*rw)|0),ty+r,1,1,['#ffd23f','#ff3b3b','#4aa8ff'][r%3]);
 }
 if(L)R(tx+w/2-1,ty-2,2,2,'#ffd23f');
}
function drawPlayer(){
 if(inv>0&&((frame/4)|0)%2)return;
 const t=duck?9:18,y=py-t,r=((frame/6)|0)%2,air=py<G,j=acc();
 if(shield){x.strokeStyle='#4aa8ff';x.lineWidth=1;x.strokeRect(PX-3.5,y-3.5,(duck?16:12)+7,t+7)}
 if(duck){R(PX,y+2,14,5,RED);R(PX,y+2,14,1,'#fff');R(PX+6,y+4,2,1,'#111');R(PX+10,y,6,5,'#f5c28b');R(PX+13,y+1,2,2,'#222');R(PX+11,y+3,5,2,'#fff');R(PX+2,y+7,3,2,RED);R(PX+8,y+7,3,2,RED);R(PX+2,y+8,3,1,'#111');R(PX+8,y+8,3,1,'#111');hat(PX+10,y,6)}
 else{
  R(PX+3,y,7,7,'#f5c28b');R(PX+3,y,7,2,'#2b1b3d');R(PX+8,y+3,2,2,'#222');R(PX+4,y+5,6,2,'#fff');R(PX+2,y+7,9,7,RED);R(PX+2,y+7,9,1,'#fff');R(PX+2,y+11,9,1,'#111');R(PX+6,y+11,2,1,'#ffd23f');R(PX+5,y+8,1,1,'#fff');R(PX+5,y+13,2,1,'#fff');
  const l1=air?4:(r?2:4),l2=air?4:(r?4:2);R(PX+3,y+14,3,l1,RED);R(PX+3,y+13+l1,3,1,'#111');R(PX+7,y+14,3,l2,RED);R(PX+7,y+13+l2,3,1,'#111');hat(PX+3,y,7);
 }
}
function city(off,wd,top,vr,seed,dark,lit){
 const k0=Math.floor(off/wd);
 for(let k=k0;k<k0+W/wd+2;k++){
  const bx=k*wd-off,h=top+hs(k,seed)*vr,y=G-h;
  R(bx,y,wd-1,h,dark);R(bx,y,wd-1,2,SNOW);
  if(lit){
   for(let j=0;y+6+j*6<G-6;j++)for(let i=0;i<(wd-6)/6;i++){const r=hs(k*17+i,seed+j);if(r>.5)R(bx+3+i*6,y+6+j*6,3,3,r>.9?'#39ff7a':r>.75?'#ff3b3b':'#ffe9a0')}
   if(hs(k,seed+9)>.78){x.globalAlpha=.25;R(bx+2,y-8,wd-5,8,acc());x.globalAlpha=1;R(bx+4,y-6,wd-9,4,acc())}
  }
 }
}
const GL={s:[7,4,7,1,7],m:[5,7,7,5,5],h:[5,5,7,5,5]};
function pu(p){
 const bx=Math.round(p.x),by=Math.round(p.y),g=GL[p.t];
 R(bx-5,by-5,11,11,'#fff');R(bx-4,by-4,9,9,{s:'#1f9d4a',m:'#d8202a',h:'#ff3b6b'}[p.t]);
 for(let r=0;r<5;r++)for(let c=0;c<3;c++)if(g[r]>>(2-c)&1)R(bx-1+c,by-2+r,1,1,'#fff');
 R(bx-4,by-7,3,2,'#ffd23f');R(bx+2,by-7,3,2,'#ffd23f');R(bx-1,by-6,2,2,'#fff');
}
/* tree lying on its side, tip pointing forward, trunk at the back, strapped to the roof */
function treeH(tx,ty,L,h,roof){
 for(let c=0;c<L;c++){const ch=Math.max(1,Math.round(h*(c+1)/L));R(tx+c,ty+(h-ch)/2,1,ch,c%4<2?'#0f7a38':'#1f9d4a');if(hs(c,L)>.8)R(tx+c,ty+(h/2|0),1,1,['#ffd23f','#ff3b3b','#4aa8ff'][c%3])}
 R(tx+L,ty+h/2-1,2,2,'#6b4423');
 for(const s of [.3,.72]){const sx=tx+Math.floor(L*s);R(sx,ty,1,roof-ty+3,'#f2e6b0');R(sx-1,ty,3,1,'#ff3b3b')}
}
function drawCar(o){
 const v=o.k,th=o.th,y0=o.y+th,bt=y0+(v?5:3),rh=bt-y0+1,hh=o.h-th;
 R(o.x,bt,o.w,y0+hh-bt-1,o.col);
 R(o.x+(v?2:4),y0,o.w-(v?4:8),rh,o.col);
 R(o.x+(v?4:5),y0+1,o.w-(v?8:10),rh-2,'#bfefff');
 R(o.x,bt+1,2,2,'#ffec3d');R(o.x+o.w-2,bt+1,2,2,'#ff3b3b');
 R(o.x+3,y0+hh-3,4,3,'#111');R(o.x+o.w-7,y0+hh-3,4,3,'#111');
 if(th)treeH(o.x+o.w/2-o.tl/2,o.y,o.tl,th,y0)
 else hat(o.x+o.w/2-2,y0+1,5);
}
function drawBird(o){
 const up=((frame/8)|0)%2,B='#deded8';
 const D='#a0693a';R(o.x+3,o.y+3,8,4,D);R(o.x+3,o.y+6,8,1,'#e8d9a0');R(o.x,o.y+1,4,4,D);R(o.x-2,o.y+3,2,2,D);R(o.x+1,o.y+2,1,1,'#111');R(o.x+11,o.y+3,2,2,'#fff');R(o.x+2,o.y+3,2,1,'#c8a165');
 if(up){R(o.x+4,o.y+7,1,3,D);R(o.x+9,o.y+7,1,3,D);R(o.x+5,o.y+9,1,1,D);R(o.x+10,o.y+9,1,1,D)}else{R(o.x+4,o.y+7,1,2,D);R(o.x+9,o.y+7,1,2,D);R(o.x+2,o.y+8,2,1,D);R(o.x+11,o.y+8,2,1,D)}
 R(o.x+1,o.y-2,1,3,'#e8d9a0');R(o.x-1,o.y-3,1,2,'#e8d9a0');R(o.x+3,o.y-3,1,4,'#e8d9a0');R(o.x+4,o.y-4,2,1,'#e8d9a0');
 if(o.ru){x.globalAlpha=.35+.25*up;R(o.x-5,o.y,8,8,'#ff2020');x.globalAlpha=1;R(o.x-2,o.y+3,2,2,'#ff2020');R(o.x-2,o.y+3,1,1,'#ffb0b0')}else R(o.x-2,o.y+3,2,2,'#3a2a1a');
}
function drawBoss(){
 const b=boss,bc=b.flash>0?'#fff':RED,bx=b.x,y=G-46,a=acc(),p=((frame/10)|0)%2;
 if(b.dead&&((frame/3)|0)%2)return;
 R(bx+2,G-8,32,8,'#222');for(let i=0;i<3;i++)R(bx+4+i*11,G-7,6,6,'#555');
 R(bx+4,G-12,28,4,'#333');
 R(bx-3,y+14,6,10,'#fff');R(bx+33,y+14,6,10,'#fff');
 R(bx,y+16,36,18,bc);R(bx,y+16,36,2,'#fff');R(bx,y+32,36,2,'#fff');
 R(bx,y+25,36,4,'#111');R(bx+14,y+25,8,4,'#ffd23f');R(bx+16,y+26,4,2,'#111');
 R(bx+4,y+20,3,3,p?a:'#fff');R(bx+29,y+20,3,3,p?'#fff':a);
 R(bx+7,y+3,22,13,'#9aa3b5');R(bx+9,y+7,18,5,'#111');
 R(bx+11,y+8,4,3,'#ff3b3b');R(bx+21,y+8,4,3,'#ff3b3b');R(bx+12,y+8,2,1,'#fff');R(bx+22,y+8,2,1,'#fff');
 R(bx+8,y+12,20,5,'#fff');R(bx+11,y+17,14,2,'#fff');
 R(bx+6,y+1,24,3,'#fff');R(bx+8,y-5,18,6,bc);R(bx+20,y-8,8,4,bc);R(bx+26,y-10,5,5,'#fff');
